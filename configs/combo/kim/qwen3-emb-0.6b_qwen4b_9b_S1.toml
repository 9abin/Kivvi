# kim_qwen3-emb-0.6b_qwen4b_9b_S1
# 임베딩 Qwen/Qwen3-Embedding-0.6B | 리랭커 qwen4b | LLM qwen3.5:9b | 선택 켬
# 코드는 고정이다. 바꾸는 것은 이 파일의 [embedding] [reranker] [llm.*] [select] 값뿐이다.
name = "kim_qwen3-emb-0.6b_qwen4b_9b_S1"

[data]
questions = "eval/answer_eval_100_tiered.jsonl"   # 개발용 평가셋. 시험용(holdout)은 마지막에 상위 2개 조합에만 1회: --set data.questions=\"eval/answer_eval_holdout.jsonl\"
out_dir = "eval/combo"

[rewrite]
source = "llm"                                    # 담당 LLM이 질문 전체를 직접 바꿔 쓴다 (① 단계). 시간을 재므로 workers = 1
workers = 1

[embedding]
model = "Qwen/Qwen3-Embedding-0.6B"
fp16 = true
instruction = "@config"   # config.EMBED_QUERY_INSTRUCT (질문 앞 지시문)
max_seq_length = 512
batch_size = 16

[reranker]
kind = "qwen"                    # 후보 목록당 약 43분. GPU 6GiB + 나머지 CPU 오프로드
model = "Qwen/Qwen3-Reranker-4B"
gpu_mem = "6GiB"
cpu_mem = "24GiB"
batch_size = 2
max_length = 2048

[llm.default]
model = "qwen3.5:9b"
base_url = "http://localhost:11434/v1"   # Ollama OpenAI 호환 주소
reasoning_effort = "none"                # 사고 모드 끄기 (파싱이 깨지지 않게)
timeout = 300

[select]
enabled = true                               # 켬: 리랭크 상위 pool개 조에서 LLM이 k개(8, 10)를 고른다
pool = 16
ks = [8, 10]

[judge]                                           # 채점 모델 (⑥ 답변 단계에서만 쓴다). 후보 LLM이 아닌 모델로 확정 필요 (미정)
model = "gpt-5.6-luna"

[eval]
rerank_ks = [5, 8, 10, 16]
final_ks = [8, 10]
answer_k = 8
# num_ctx = 4096                                  # Ollama에 적용한 컨텍스트 길이를 적어 두면 요약의 환경 한 줄에 기록된다
