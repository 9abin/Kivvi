# 그래프 RAG 확정 조합 cmb2 (2026-10-30): best_20261030에 세 가지를 더했다.
# 봉인셋(57문항, 정답 조 144개) 입력 필수 조: 기준 best_20261029 118 -> best_20261030 128 -> 이 설정 132.
# best_20261030 대비 추가 효과는 확인되지 않았다 (과제 1승 0패 18무, p=1.0). 나빠진 과제가 없고 개발셋에서 올라 채택한다. 입력은 약 1,200자 늘어난다.
# 추가 효과의 확인은 새 검증셋에서 한다 (reports/search-flow-summary-20261030.md 6절).
#   onto.rerank_arts: 규정문 검색 상위 조 30개의 청크를 리랭커 후보에 더한다 (후보 30개에 못 든 조를 구한다)
#   graph.def_file + DEF_OF: 본 결과에 든 규정의 정의·용어 조를 그래프 후보에 더한다 (scripts/onto_def_edges.py)
#   budget.def_last: 정의 조는 후보 맨 뒤 (남는 자리에만 들어가 다른 후보를 밀어내지 못한다)
# 이전: 그래프 RAG 확정 조합 v2 (2026-10-30). best_20261029에 두 가지를 더했다: onto.stmt_title(규정문 임베딩에 규정 이름 > 조 제목),
# budget.cited_first(1차 조립에서 잘린 인용 조를 그래프 조보다 먼저). 개발용 평가셋 입력 정답: r3 116/117, v4 101/105, 법률 28/30.
# 이전 조합 (2026-10-29, reports/graph-build-plan-20261028.md 13.17~13.25).
# 휴가·휴직 파일럿(eval/onto_leave2)에서 r3·v4·법률 개발용을 보고 고른 설정이다. 전체 구축 결과(eval/onto_full)를 가리킨다.
# 파일럿으로 다시 잴 때: --set 'onto.dir="eval/onto_leave2"' --set 'graph.deleg_file="eval/onto_leave2/deleg.json"' --set 'graph.law_file="eval/law_links.json"'
# 평가셋은 실행할 때 고른다: --set 'data.questions="eval/cases_v4_20261028.jsonl"' --set 'data.out_dir="eval/cases_run_v4"' --stage final
name = "graph_cmb2_20261030"

[data]
questions = "eval/cases_v3_20261028_r3.jsonl"
out_dir = "eval/cases_run_v3"

[rewrite]
source = "llm"
workers = 1
prompt = "both"          # 기존 바꿔 쓰기 + HyDE 가상 조문. "default"와 "hyde"를 먼저 돌려 두어야 한다 (stages.py stage_rewrite)

[embedding]
kind = "ollama"
model = "qwen3-embedding:4b-q8_0"
base_url = "http://127.0.0.1:11434"
instruction = "@config"
batch_size = 16

[reranker]
kind = "cross"
model = "BAAI/bge-reranker-v2-m3"
fp16 = true

[llm.default]
model = "qwen3:30b-a3b-instruct-2507-q4_K_M"
base_url = "http://127.0.0.1:11434/v1"
timeout = 600

[select]
enabled = false
pool = 16
ks = [8, 10]

[keyword]
enabled = false          # 드문 단어 문자열 검색: 효과 없음 (13.25)

[graph]
enabled = true
near_k = 3               # 같은 규정 이웃 조는 리랭크 상위 3조에서 출발
policy = { CITES = "both", CITES_ANNEX = "both", DELEGATES_TO = "both", SAME_REG_NEAR = "both", ONTO_DELEG = "fwd", CITES_LAW = "fwd", DEF_OF = "fwd" }
def_file = "eval/onto_full/def_edges.json"      # scripts/onto_def_edges.py
deleg_file = "eval/onto_full/deleg.json"      # scripts/onto_deleg.py
deleg_sources = ["모델", "규칙"]               # 문서이름은 끔 (13.23)
law_file = "eval/law_links_full.json"         # scripts/graph_law_link.py. CITES_LAW만 켠다 (13.24)

[onto]
enabled = true
dir = "eval/onto_full"
mode = "B"               # 그래프 조를 하이브리드 상위 8과 따로 붙인다
place = "related"        # 예산 순서: 검색 결과 -> 인용 -> 구조선 조 -> 그래프 조
source = "stmt"          # 규정문 단위 검색 (개념 목록 고르기는 전체 규모에서 쓸 수 없다)
max = 5
top_stmt = 20
rerank_arts = 30         # 규정문 검색 상위 조 30개의 청크를 리랭커 후보에 더한다 (후보창 크기와 같은 값. T03의 순위를 알고 정했다)
stmt_title = true        # 규정문 임베딩 글 앞에 "규정 이름 > 조 제목 | "을 붙인다 (요지만으로는 어느 규정의 조인지 몰라 비슷한 요지끼리 섞인다)

[budget]                 # LLM 입력 조립 (reports/graph-results-20261029.md)
enabled = true
order = "rel"            # 그래프로 찾은 조(구조선·온톨로지·법령)를 질문과 가까운 순으로
total = 16000            # 약 11,650토큰. 로컬 답변 모델은 컨텍스트 20k~24k가 필요하다 (Ollama 기본 4,096)
share = 4000             # 검색 결과·인용은 12,000자 안에서 먼저, 남은 자리에 그래프 조
shorten = true
def_last = true          # 정의 연결로만 닿은 조는 후보 맨 뒤
cited_first = true       # 1차 조립(12,000자)에서 잘린 인용 조는 그래프 후보에서도 빠지므로, 그래프 조보다 먼저 남은 자리에 넣는다

[eval]
rerank_ks = [5, 8, 10, 16]
final_ks = [8, 10]
answer_k = 8
