# 그래프 RAG 확정 조합 (2026-10-29, reports/graph-build-plan-20261028.md 13.17~13.25).
# 휴가·휴직 파일럿(eval/onto_leave2)에서 r3·v4·법률 개발용을 보고 고른 설정이다. 전체 구축 결과(eval/onto_full)를 가리킨다.
# 파일럿으로 다시 잴 때: --set 'onto.dir="eval/onto_leave2"' --set 'graph.deleg_file="eval/onto_leave2/deleg.json"' --set 'graph.law_file="eval/law_links.json"'
# 평가셋은 실행할 때 고른다: --set 'data.questions="eval/cases_v4_20261028.jsonl"' --set 'data.out_dir="eval/cases_run_v4"' --stage final
name = "graph_best_20261029"

[data]
questions = "eval/cases_v3_20261028_r3.jsonl"
out_dir = "eval/cases_run_v3"

[rewrite]
source = "llm"
workers = 1
prompt = "both"          # 기존 바꿔 쓰기 + HyDE 가상 조문. "default"와 "hyde"를 먼저 돌려 두어야 한다 (stages.py stage_rewrite)

[embedding]
kind = "ollama"
model = "qwen3-embedding:4b-q8_0"
base_url = "http://127.0.0.1:11434"
instruction = "@config"
batch_size = 16

[reranker]
kind = "cross"
model = "BAAI/bge-reranker-v2-m3"
fp16 = true

[llm.default]
model = "qwen3:30b-a3b-instruct-2507-q4_K_M"
base_url = "http://127.0.0.1:11434/v1"
timeout = 600

[select]
enabled = false
pool = 16
ks = [8, 10]

[keyword]
enabled = false          # 드문 단어 문자열 검색: 효과 없음 (13.25)

[graph]
enabled = true
near_k = 3               # 같은 규정 이웃 조는 리랭크 상위 3조에서 출발
policy = { CITES = "both", CITES_ANNEX = "both", DELEGATES_TO = "both", SAME_REG_NEAR = "both", ONTO_DELEG = "fwd", CITES_LAW = "fwd" }
deleg_file = "eval/onto_full/deleg.json"      # scripts/onto_deleg.py
deleg_sources = ["모델", "규칙"]               # 문서이름은 끔 (13.23)
law_file = "eval/law_links_full.json"         # scripts/graph_law_link.py. CITES_LAW만 켠다 (13.24)

[onto]
enabled = true
dir = "eval/onto_full"
mode = "B"               # 그래프 조를 하이브리드 상위 8과 따로 붙인다
place = "related"        # 예산 순서: 검색 결과 -> 인용 -> 구조선 조 -> 그래프 조
source = "stmt"          # 규정문 단위 검색 (개념 목록 고르기는 전체 규모에서 쓸 수 없다)
max = 5
top_stmt = 20

[budget]                 # LLM 입력 조립 (reports/graph-results-20261029.md)
enabled = true
order = "rel"            # 그래프로 찾은 조(구조선·온톨로지·법령)를 질문과 가까운 순으로
total = 16000            # 약 11,650토큰. 로컬 답변 모델은 컨텍스트 20k~24k가 필요하다 (Ollama 기본 4,096)
share = 4000             # 검색 결과·인용은 12,000자 안에서 먼저, 남은 자리에 그래프 조
shorten = true

[eval]
rerank_ks = [5, 8, 10, 16]
final_ks = [8, 10]
answer_k = 8
