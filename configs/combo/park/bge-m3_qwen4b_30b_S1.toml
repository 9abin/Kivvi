# park_bge-m3_qwen4b_30b_S1
# 임베딩 BAAI/bge-m3 | 리랭커 qwen4b | LLM qwen3:30b-a3b-instruct-2507-q4_K_M | 선택 켬
# 코드는 고정이다. 바꾸는 것은 이 파일의 [embedding] [reranker] [llm.*] [select] 값뿐이다.
name = "park_bge-m3_qwen4b_30b_S1"

[data]
questions = "eval/answer_eval_100_tiered.jsonl"   # 개발용 평가셋. 시험용(holdout)은 마지막에 상위 2개 조합에만 1회: --set data.questions=\"eval/answer_eval_holdout.jsonl\"
out_dir = "eval/combo"

[rewrite]
source = "llm"                                    # 담당 LLM이 질문 전체를 직접 바꿔 쓴다 (① 단계). 시간을 재므로 workers = 1
workers = 1

[embedding]
model = "BAAI/bge-m3"
fp16 = true

[reranker]
kind = "qwen"                    # GPU 6GiB + 나머지 CPU 오프로드 (100문항 약 6분)
model = "Qwen/Qwen3-Reranker-4B"
gpu_mem = "6GiB"
cpu_mem = "24GiB"
batch_size = 6                      # 4명 모두 같게 둔다: 질문당 3.7초, GPU 6.9GB (배치 2는 6.9초, 15 이상은 GPU 메모리 부족으로 느려짐). 배치가 다르면 점수가 0.01 안팎 달라진다
max_length = 2048

[llm.default]
model = "qwen3:30b-a3b-instruct-2507-q4_K_M"
base_url = "http://localhost:11434/v1"
timeout = 600

[select]
enabled = true                               # 켬: 리랭크 상위 pool개 조에서 LLM이 k개(8, 10)를 고른다
pool = 16
ks = [8, 10]

[judge]                                           # 채점 모델 (⑥ 답변 단계에서만 쓴다). 후보 LLM이 아닌 모델로 확정 필요 (미정)
model = "gpt-5.6-luna"

[eval]
rerank_ks = [5, 8, 10, 16]
final_ks = [8, 10]
answer_k = 8
# num_ctx = 4096                                  # Ollama에 적용한 컨텍스트 길이를 적어 두면 요약의 환경 한 줄에 기록된다
