[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvic-ontology-search"
version = "0.1.0"
requires-python = ">=3.12"
description = "Standalone KVIC ontology retrieval snapshot"
dependencies = []

[project.optional-dependencies]
lexical = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["ontology_search*"]
