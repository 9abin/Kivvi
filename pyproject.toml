[project]
name = "regcheck"
version = "0.0.1"
description = "KVIC 내부규정 조항 점검 에이전트"
requires-python = ">=3.12"
dependencies = [
    "olefile>=0.47",
    "pypdf>=6.0",
]

[project.optional-dependencies]
# 벡터 색인용 (GPU). 설치: uv sync --extra vector
vector = [
    "torch>=2.6",
    "sentence-transformers>=3",
    "chromadb>=1.0",
]

# 규정 원문 DB(PostgreSQL) 접속. 설치: uv sync --extra db
db = ["psycopg[binary]>=3.2"]

[dependency-groups]
app = [
    "streamlit>=1.40",
]
dev = ["pytest>=8"]
# 노트북으로 흐름 따라가기 (notebooks/). 설치: uv sync --group notebook
notebook = ["ipykernel>=6", "pandas>=2", "nbformat>=5", "nbclient>=0.10"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
