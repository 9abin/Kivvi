[project]
name = "regcheck"
version = "0.0.1"
description = "KVIC 내부규정 조항 점검 에이전트와 규정 RAG 챗봇"
requires-python = ">=3.12"
dependencies = [
    "kiwipiepy>=0.24.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.4.3",
    "olefile>=0.47",
    "openai>=2.54.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
# torch·sentence-transformers는 기본 의존성으로 옮겼다. chromadb만 선택 설치: uv sync --extra vector
vector = ["chromadb>=1.0"]

# 규정 원문 DB(PostgreSQL) 접속. 설치: uv sync --extra db
db = ["psycopg[binary]>=3.2"]

[dependency-groups]
app = [
    "streamlit>=1.40",
]
dev = ["pytest>=8"]
# 노트북으로 흐름 따라가기 (notebooks/). 설치: uv sync --group notebook
notebook = ["ipykernel>=6", "pandas>=2", "nbformat>=5", "nbclient>=0.10"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
