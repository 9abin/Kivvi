      <path d="M390 312H290" marker-end="url(#g)"/>
      <path d="M600 312H470" marker-end="url(#g)"/>
      <path d="M1050 312H680" marker-end="url(#g)"/>
      <path d="M430 160V260" marker-end="url(#g)"/>
