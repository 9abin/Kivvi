      .c { font-size: 11.5px; font-weight: 600; fill: #5a6a93; text-anchor: middle; paint-order: stroke; stroke: #f5f7fc; stroke-width: 4px; stroke-linejoin: round; }
      .i { fill: none; stroke: #1677f9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .f { fill: #edf4ff; }
