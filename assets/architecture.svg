  <text x="182" y="54" font-size="14" font-weight="800" fill="#0f63d6">로컬</text>
  <rect x="1000" y="196" width="180" height="236" rx="20" fill="#ff8a3d" fill-opacity="0.07" stroke="#ff8a3d" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="7 6"/>
