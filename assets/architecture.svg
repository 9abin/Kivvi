<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2b4a8f" flood-opacity="0.10"/></filter>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#1677f9" stroke-width="1.5" stroke-linejoin="miter"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#8d99b8" stroke-width="1.5" stroke-linejoin="miter"/></marker>
    <style>
