[project]
name = "rag-pipeline"
version = "0.1.0"
description = "한국벤처투자 내부규정 RAG 전처리 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "kiwipiepy>=0.24.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.4.3",
    "olefile>=0.46",
    "openai>=2.54.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=5.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
